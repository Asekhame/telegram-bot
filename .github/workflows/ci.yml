name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read


# CI is deterministic: no live RPC or Telegram calls. The poller's chain
# correctness against live data is verified separately with `npm run scan`.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
